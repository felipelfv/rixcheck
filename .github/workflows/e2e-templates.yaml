name: e2e-templates

# End-to-end check of the scaffolded templates: install the package, scaffold
# a minimal Nix-pinned project, then prove the generated Dockerfile builds the
# pinned environment and the generated compare script verifies outputs inside
# the container. R-CMD-check tests the R code; this tests what users ship.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install rixcheck
        run: R CMD INSTALL .

      - name: Scaffold a toy pinned project
        run: |
          mkdir /tmp/proj && cd /tmp/proj
          git init -q
          git config user.email "ci@example.com"
          git config user.name "CI"

          cat > default.nix <<'EOF'
          let
           pkgs = import (fetchTarball "https://github.com/rstats-on-nix/nixpkgs/archive/2026-06-22.tar.gz") {};
            system_packages = builtins.attrValues {
              inherit (pkgs) R glibcLocales nix;
            };
            shell = pkgs.mkShell {
              LOCALE_ARCHIVE = if pkgs.stdenv.hostPlatform.system == "x86_64-linux" then "${pkgs.glibcLocales}/lib/locale/locale-archive" else "";
              LANG = "en_US.UTF-8";
              buildInputs = [ system_packages ];
            };
          in
            { inherit pkgs shell; }
          EOF

          cat > analysis.R <<'EOF'
          set.seed(1)
          x <- rnorm(100)
          dir.create("results", showWarnings = FALSE)
          write.csv(data.frame(mean = round(mean(x), 6), sd = round(sd(x), 6)),
                    "results/result.csv", row.names = FALSE)
          EOF

          Rscript -e 'rixcheck::use_repro_check(run = "Rscript analysis.R", outputs = "results")'
          Rscript -e 'rixcheck::use_repro_dockerfile(run = "Rscript analysis.R")'
          test -f .github/workflows/repro-check.yml
          test -f tools/repro-compare.R
          test -f Dockerfile

          Rscript analysis.R
          git add -A && git commit -qm "baseline"

      - name: Build the generated Dockerfile
        run: cd /tmp/proj && docker build -t e2e .

      - name: Run the container as a reader would
        run: docker run --rm e2e

      - name: Full check inside the container
        run: >
          docker run --rm e2e
          nix-shell default.nix --run
          "Rscript analysis.R && Rscript tools/repro-compare.R results"
