# retrieved and slightly changed from github.com/anthropics/claude-code-action
name: Claude Code Review

# runs automatically once when a pr is opened
on:
  pull_request:
    types: [opened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request for correctness bugs, numerical issues,
            edge cases, and code quality. Post a short summary comment, and
            inline comments on the specific lines where you find issues.
          track_progress: true
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
